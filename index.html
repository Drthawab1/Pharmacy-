<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>كاشير الصيدلية</title>
<style>
:root{--p:#0f766e;--p2:#0d5f59;--bg:#f1f5f4;--card:#fff;--bd:#d9e2e0;--tx:#1b2b29;--mut:#6b7f7c;--red:#c62828;--org:#e08a00;--grn:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--p);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0;flex:1;min-width:120px}
.badge{background:rgba(255,255,255,.18);border-radius:8px;padding:4px 10px;font-size:14px}
nav{display:flex;gap:4px;background:var(--p2);padding:4px 8px;overflow-x:auto;position:sticky;top:48px;z-index:9}
nav button{flex:1;min-width:90px;background:transparent;color:#cfe9e6;border:0;padding:10px 6px;border-radius:8px;font:inherit;font-size:15px}
nav button.on{background:#fff;color:var(--p);font-weight:bold}
main{padding:10px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:17px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;margin:0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}.row>.btn{flex:0 0 auto}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;cursor:pointer;white-space:nowrap}
.btn.sec{background:#e3ecea;color:var(--p)}.btn.danger{background:var(--red)}.btn.wa{background:#1fa855}.btn.sm{padding:6px 10px;font-size:14px}.btn.big{width:100%;font-size:19px;padding:14px}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.list>div:last-child{border:0}.list small{color:var(--mut);display:block}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){.pos{grid-template-columns:1fr}}
.cartline{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
.cartline .nm{flex:1}.cartline button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:18px}
.total{font-size:26px;font-weight:bold;color:var(--p);text-align:center;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--p);margin-top:4px}.stat span{font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#e3ecea;color:var(--p)}
.tag.red{background:#fde4e4;color:var(--red)}.tag.org{background:#fff1d6;color:#9a6200}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
@media(min-width:700px){.modalbg{align-items:center}.modal{border-radius:16px}}
.scanov{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanov video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.scanov .frame{position:relative;width:70%;max-width:420px;height:160px;border:3px solid #4ade80;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.scanov .btn{position:absolute;bottom:30px;z-index:2}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:200;display:none;max-width:90%;text-align:center}
.login{max-width:380px;margin:8vh auto;padding:0 14px}
.login h2{text-align:center;color:var(--p)}
.hide{display:none!important}
.rcpt{max-width:100%;border:1px dashed var(--bd);display:block;margin:8px auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}
.alert{border-inline-start:4px solid var(--org);padding:6px 10px;margin:4px 0;background:#fffaf0;border-radius:6px;font-size:14px}
.alert.red{border-color:var(--red);background:#fff5f5}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
